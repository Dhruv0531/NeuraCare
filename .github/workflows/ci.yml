name: NeuraCare CI/CD Quality & Security Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1: Python Machine Learning & Stepped Adaptive Engine Test Suite
  # ───────────────────────────────────────────────────────────────────────────
  ml-service-tests:
    name: ML & Stepped Adaptive Testing (Python 3.10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'src/backend/requirements.txt'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/backend/requirements.txt
          pip install pytest

      - name: Run Pytest ML & Adaptive Engine Suite
        env:
          PYTHONPATH: src/backend
        run: |
          pytest src/backend/tests -v

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2: Express.js Backend API, RBAC & Security Test Suite
  # ───────────────────────────────────────────────────────────────────────────
  backend-api-tests:
    name: Express API & RBAC Testing (Node.js 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Backend Unit & Integration Tests
        run: npm test

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3: Next.js Frontend Unit Tests, Linting & Production Build
  # ───────────────────────────────────────────────────────────────────────────
  frontend-tests-and-build:
    name: Next.js Frontend Quality & Production Build (Node.js 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Frontend Tests
        run: npm test

      - name: Lint Frontend Codebase
        run: npm run lint

      - name: Build Next.js Production Bundle
        env:
          NEXT_PUBLIC_API_URL: https://neuracare-backend.onrender.com
        run: npm run build

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 4: Master End-to-End Sanity & Architecture Verification
  # ───────────────────────────────────────────────────────────────────────────
  e2e-sanity-verification:
    name: Master 4-Tier Sanity Verification
    needs: [ ml-service-tests, backend-api-tests, frontend-tests-and-build ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install ML Runtime Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r src/backend/requirements.txt

      - name: Run Master Sanity Verification Suite
        env:
          PYTHONPATH: src/backend
        run: |
          python run_sanity_check.py

